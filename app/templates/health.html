{% extends "base.html" %}{% block title %}Health{% endblock %}{% block content %}<h1 class="h3">Operational health</h1><div class="list-group">{% for key, value in health.items() if key != 'ok' %}<div class="list-group-item d-flex justify-content-between"><span>{{ key.replace('_', ' ')|title }}</span><span class="badge {{ 'text-bg-success' if value else 'text-bg-danger' }}">{{ 'PASS' if value else 'FAIL' }}</span></div>{% endfor %}</div>{% endblock %}
